name: Makefile CI

on:
  push:
    branches: [ "wonderful-u9" ]
  pull_request:
    branches: [ "wonderful-u9" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: configure
      run: ./configure

    - name: Install dependencies
      run: make

    - name: Run check
      run: make check

    - name: Run distcheck
      run: make distcheck
